# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOPRIVATE: github.com/omc
  # eMudhra G3 incident: make JavaScript actions trust the system bundle that
  # the "Refresh CA certificates" step fixes. Remove with that step.
  NODE_OPTIONS: "--use-openssl-ca"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: "runs-on=${{ github.run_id }}/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64/extras=s3-cache"
    timeout-minutes: 15
    steps:
      # eMudhra G3 incident (2026-10-20): RunsOn's images predate Ubuntu's
      # ca-certificates fix (USN-8944-1) and still trust "emSign ECC Root CA - G3"
      # and "AAA Certificate Services". Refresh the bundle before any step uses the
      # network, and fail if the fix didn't land. Remove once RunsOn ships images
      # built after 2026-10-20.
      - name: Refresh CA certificates
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
          version=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$version" ge 20260816ubuntu0.24.04.1; then
            echo "::error::ca-certificates $version predates the fix"; exit 1
          fi
          subjects=$(openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt | openssl pkcs7 -print_certs -noout)
          for root in "emSign ECC Root CA - G3" "AAA Certificate Services"; do
            if grep -qF "CN = $root" <<<"$subjects"; then
              echo "::error::$root is still trusted"; exit 1
            fi
          done
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4.1.5
      - uses: actions/setup-go@v5.0.1
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4.1.5
      - run: go mod download
      - name: Build
        run: task build
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82d40c283aeb1f2b6595839195e95c2d6a49081b # v5.0.0
        with:
          version: latest

  flakey-lint:
    name: Flakey Lint
    runs-on: "runs-on=${{ github.run_id }}/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64/extras=s3-cache"
    timeout-minutes: 15
    steps:
      # eMudhra G3 incident (2026-10-20): RunsOn's images predate Ubuntu's
      # ca-certificates fix (USN-8944-1) and still trust "emSign ECC Root CA - G3"
      # and "AAA Certificate Services". Refresh the bundle before any step uses the
      # network, and fail if the fix didn't land. Remove once RunsOn ships images
      # built after 2026-10-20.
      - name: Refresh CA certificates
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
          version=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$version" ge 20260816ubuntu0.24.04.1; then
            echo "::error::ca-certificates $version predates the fix"; exit 1
          fi
          subjects=$(openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt | openssl pkcs7 -print_certs -noout)
          for root in "emSign ECC Root CA - G3" "AAA Certificate Services"; do
            if grep -qF "CN = $root" <<<"$subjects"; then
              echo "::error::$root is still trusted"; exit 1
            fi
          done
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4.1.5
      - uses: actions/setup-go@v5.0.1
        with:
          go-version: '1.22'
          cache: true
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4.1.5
      - run: go mod download
      - name: Run additional linters - tfproviderlint is flakey on go >=1.22.0
        run: task lint
  # source: https://github.com/vercel/terraform-provider-vercel
  # source license: MPL-2.0
  docs:
    name: Docs Test
    timeout-minutes: 5
    runs-on: "runs-on=${{ github.run_id }}/cpu=2/family=c7i+m7i/image=ubuntu24-full-x64"
    steps:
      # eMudhra G3 incident (2026-10-20): RunsOn's images predate Ubuntu's
      # ca-certificates fix (USN-8944-1) and still trust "emSign ECC Root CA - G3"
      # and "AAA Certificate Services". Refresh the bundle before any step uses the
      # network, and fail if the fix didn't land. Remove once RunsOn ships images
      # built after 2026-10-20.
      - name: Refresh CA certificates
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
          version=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$version" ge 20260816ubuntu0.24.04.1; then
            echo "::error::ca-certificates $version predates the fix"; exit 1
          fi
          subjects=$(openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt | openssl pkcs7 -print_certs -noout)
          for root in "emSign ECC Root CA - G3" "AAA Certificate Services"; do
            if grep -qF "CN = $root" <<<"$subjects"; then
              echo "::error::$root is still trusted"; exit 1
            fi
          done
      - name: Set up Go
        uses: actions/setup-go@v5.0.1
        with:
          go-version: "1.22"
        id: go
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4.1.5
      - name: Check if docs are up-to-date
        run: |
          task docs
          git diff
          BADDOCS=$(git status --porcelain)
          test -z "$BADDOCS" || (echo -e "documentation needs regenerating using task docs: $BADDOCS"; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    if: ${{ github.event.label.name == 'acceptance' }}
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: "runs-on=${{ github.run_id }}-${{ strategy.job-index }}/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64/extras=s3-cache"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Current Bonsai dev account is limited to the number of sandbox items
      # which can be created.
      max-parallel: 1
      matrix:
        include:
          - tool: opentofu
            version: v1.6.x
          - tool: opentofu
            version: v1.7.x
          - tool: terraform
            version: v1.7.*
          - tool: terraform
            version: v1.8.*
          - tool: terraform
            version: v1.9.*

    steps:
      # eMudhra G3 incident (2026-10-20): RunsOn's images predate Ubuntu's
      # ca-certificates fix (USN-8944-1) and still trust "emSign ECC Root CA - G3"
      # and "AAA Certificate Services". Refresh the bundle before any step uses the
      # network, and fail if the fix didn't land. Remove once RunsOn ships images
      # built after 2026-10-20.
      - name: Refresh CA certificates
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
          version=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$version" ge 20260816ubuntu0.24.04.1; then
            echo "::error::ca-certificates $version predates the fix"; exit 1
          fi
          subjects=$(openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt | openssl pkcs7 -print_certs -noout)
          for root in "emSign ECC Root CA - G3" "AAA Certificate Services"; do
            if grep -qF "CN = $root" <<<"$subjects"; then
              echo "::error::$root is still trusted"; exit 1
            fi
          done
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4.1.5
      - uses: actions/setup-go@v5.0.1
        with:
          go-version-file: 'go.mod'
          cache: true
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - if: matrix.tool == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          TF_LOG: "INFO"
          BONSAI_API_KEY: ${{ secrets.BONSAI_API_KEY }}
          BONSAI_API_TOKEN: ${{ secrets.BONSAI_API_TOKEN }}
        run: go test -v -cover ./internal/...
        timeout-minutes: 10
