# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

env:
  # eMudhra G3 incident: make JavaScript actions trust the system bundle that
  # the "Check CA certificates" step checks. Remove with that step.
  NODE_OPTIONS: "--use-openssl-ca"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  goreleaser:
    # On-demand (spot=false): goreleaser signs and publishes a GitHub release,
    # and an interruption mid-run could leave a half-published release.
    runs-on: "runs-on=${{ github.run_id }}/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64/spot=false"
    steps:
      # eMudhra G3 incident (2026-10-20): RunsOn's images may predate Ubuntu's
      # ca-certificates fix (USN-8944-1) and still trust "emSign ECC Root CA - G3"
      # and "AAA Certificate Services". Check only: this step never changes the
      # trust store. If the image lacks the fix, the job fails and reports it.
      - name: Check CA certificates
        run: |
          dpkg-query -W ca-certificates
          version=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$version" ge 20260816ubuntu0.24.04.1; then
            echo "::error::ca-certificates $version predates the fix (not refreshing; report to RunsOn image owners)"; exit 1
          fi
          subjects=$(openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt | openssl pkcs7 -print_certs -noout)
          for root in "emSign ECC Root CA - G3" "AAA Certificate Services"; do
            if grep -qF "CN = $root" <<<"$subjects"; then
              echo "::error::$root is still trusted"; exit 1
            fi
          done
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
